<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./output.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <title>Index_2</title>
</head>
<body>
   <section class="bg-[#050908] text-white body-font overflow-hidden" id="herosection">

  <div class="container px-5 py-10 mx-auto">

    <div class="lg:w-[1150px] mx-auto flex flex-wrap items-center">

      <!-- LEFT CONTENT -->
      <div class="lg:w-1/2 w-full lg:pr-8 lg:py-6 mb-10 lg:mb-0">

        <!-- Small Heading -->
        <h2
          class="font-['Inter'] text-[13px] font-semibold text-[#39ff5a]
                 uppercase leading-[1.2] tracking-[0.2px] mb-3">
          FLAGSHIP SMARTPHONE
        </h2>


        <!-- Main Heading -->
        <h1
          class="font-['Inter'] text-[40px] font-bold text-white
                 leading-[1.05] tracking-[-1.5px]">
          Elegant Design.
        </h1>

        <h1
          class="font-['Inter'] text-[40px] font-bold text-[#39ff5a]
                 leading-[1.05] tracking-[-1.5px]">
          Powerful Inside.
        </h1>


        <!-- Description -->
        <p
          class="font-['Inter'] text-[13px] font-medium text-[#f1f1f1]
                 leading-[1.8] tracking-[0] mt-5 mb-8">
          Sleek. Sophisticated. Built for what's next.<br>
          The perfect balance of style and performance in your hand.
        </p>


        <!-- FEATURES -->
        <div class="mb-9 w-full">

          <ul class="flex items-center gap-5">

            <!-- Processor -->
            <li class="flex items-center gap-2.5 flex-1 min-w-0">

              <i
                class="fa-solid fa-microchip text-[25px]
                       text-[#39ff5a] shrink-0">
              </i>

              <div class="min-w-0">
                <h4
                  class="font-['Inter'] text-[12px] font-semibold
                         text-gray-200 leading-[1.3]">
                  Snapdragon 8 Gen 3
                </h4>

                <p
                  class="font-['Inter'] text-[10px] font-normal
                         text-gray-400 mt-1 leading-[1.3]">
                  Octa-core Processor
                </p>
              </div>

            </li>


            <!-- Display -->
            <li class="flex items-center gap-2.5 flex-1 min-w-0">

              <i
                class="fa-solid fa-mobile-screen-button text-[25px]
                       text-[#39ff5a] shrink-0">
              </i>

              <div class="min-w-0">
                <h4
                  class="font-['Inter'] text-[12px] font-semibold
                         text-gray-200 leading-[1.3]">
                  6.7" AMOLED
                </h4>

                <p
                  class="font-['Inter'] text-[10px] font-normal
                         text-gray-400 mt-1 leading-[1.3]">
                  120Hz Display
                </p>
              </div>

            </li>


            <!-- Camera -->
            <li class="flex items-center gap-2.5 flex-1 min-w-0">

              <i
                class="fa-solid fa-camera text-[25px]
                       text-[#39ff5a] shrink-0">
              </i>

              <div class="min-w-0">
                <h4
                  class="font-['Inter'] text-[12px] font-semibold
                         text-gray-200 leading-[1.3]">
                  50MP OIS Camera
                </h4>

                <p
                  class="font-['Inter'] text-[10px] font-normal
                         text-gray-400 mt-1 leading-[1.3]">
                  Stunning Low Light
                </p>
              </div>

            </li>

          </ul>

        </div>


        <!-- PRICE + BUTTONS -->
        <div>

          <!-- Price -->
          <div class="mb-8">
            <span
              class="font-['Inter'] text-[30px] font-bold
                     text-[#39ff5a] leading-none tracking-[-1px]">
              ₹56,999
            </span>
          </div>


          <!-- Buttons -->
          <div class="flex items-center">

            <button
              class="font-['Inter'] text-[15px] font-semibold
                     text-[#071008] bg-[#39ff5a]
                     rounded-full py-4 px-8
                     leading-none
                     hover:bg-[#32e951] transition">
              Add to Cart
              <i class="fa-solid fa-arrow-right ml-2 text-[13px]"></i>
            </button>


            <button
              class="rounded-full w-11 h-11
                     inline-flex items-center justify-center
                     text-white border-2 border-[#39ff5a]
                     ml-5">

              <i class="fa-regular fa-heart text-[18px]"></i>

            </button>

          </div>

        </div>

      </div>


      <!-- RIGHT IMAGE -->
      <div class="lg:w-1/2 w-full flex justify-end">

        <img
          alt="Nexa Smartphone"
          class="w-full max-w-[590px] h-[560px]
                 object-contain object-center
                 rounded-lg"
          src="images/phone.png">

      </div>

    </div>

  </div>

</section>
</body>
</html>
